name: Сборка Android APK

# Собирает APK мобильного приложения «Триада Менделеева» (обёртка Capacitor
# над сайтом). Готовый файл появляется во вкладке Actions → запуск → Artifacts.
on:
  workflow_dispatch: {}        # ручной запуск кнопкой в Actions
  push:
    # Все ветки: правки в mobile/ проверяются компиляцией ДО попадания в main.
    # Локально Java собрать нечем (на машине только JRE, без Android SDK), поэтому
    # compile-check — единственный способ поймать ошибку до релиза.
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  # Проверка, что код вообще компилируется. Секреты тут НЕ нужны: debug-сборка
  # подписывается автоматическим ключом Android, поэтому job падает только на
  # настоящих ошибках кода — и ловит их даже когда релизный ключ не настроен.
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Гарантировать SDK-пакеты (platform/build-tools 34)
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Установка зависимостей
        working-directory: mobile
        run: npm ci

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Компиляция (debug, без ключа подписи)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  # Есть ли ключ подписи в Secrets. Нужен отдельным job'ом, потому что в условии
  # job'а нельзя читать secrets напрямую — только выход предыдущего job'а.
  gate:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.check.outputs.have_key }}
    steps:
      - name: Проверка наличия ключа
        id: check
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "have_key=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Ключа подписи в Secrets нет — подписанный APK не собираем. Это не ошибка: см. mobile/KEYSTORE.md."
          else
            echo "have_key=1" >> "$GITHUB_OUTPUT"
          fi

  # Подписанный APK собираем только когда ключ реально есть: иначе job ПРОПУСКАЕТСЯ,
  # а не падает — чтобы не сыпать письмами «Run failed» на каждый пуш.
  build:
    needs: [compile-check, gate]
    if: needs.gate.outputs.have_key == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Гарантировать SDK-пакеты (platform/build-tools 34)
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Установка зависимостей
        working-directory: mobile
        run: npm ci

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      # Ключ подписи больше НЕ лежит в репозитории (был утёчкой: репо публичный).
      # Он приходит из Secrets и существует только внутри одноразового раннера.
      - name: Ключ подписи из Secrets
        env:
          KS_B64:   ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_B64 — подписывать APK нечем."
            echo "Заведите секреты: Settings → Secrets and variables → Actions (инструкция — mobile/KEYSTORE.md)."
            exit 1
          fi
          mkdir -p mobile/android/keystore
          printf '%s' "$KS_B64" | tr -d '\n\r ' | base64 -d > mobile/android/keystore/triada-release.jks
          {
            printf 'storeFile=keystore/triada-release.jks\n'
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "${KS_ALIAS:-triada}"
            printf 'keyPassword=%s\n' "${KEY_PASS:-$KS_PASS}"
          } > mobile/android/keystore.properties
          echo "Ключ подписи готов ($(stat -c%s mobile/android/keystore/triada-release.jks) Б)."

      - name: Сборка подписанного APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             out/triada-mendeleeva.apk

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: triada-mendeleeva-apk
          path: out/triada-mendeleeva.apk
          if-no-files-found: error
